name: CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      - name: Run ESLint
        run: |
          cd frontend
          npm run lint || true
      - name: Run Frontend Tests
        run: |
          cd frontend
          npm run test
      - name: Test Production Build
        run: |
          cd frontend
          npm run build

  backend:
    name: Backend Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Install CPU PyTorch & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu torch torchaudio
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r backend/requirements.txt
          pip install pytest pytest-asyncio pytest-timeout
      - name: Run Backend Tests
        run: pytest backend/tests -v
